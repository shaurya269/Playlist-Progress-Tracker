name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Dev server starts and serves the app
        run: |
          PORT=3000 node scripts/dev-server.js &
          sleep 2
          curl -fsS http://localhost:3000/ | grep -q "Playlist Progress Tracker"
          curl -fsS http://localhost:3000/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/api/playlist?id=bad')" = "400"
