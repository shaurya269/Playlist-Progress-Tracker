<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d6203c"><title>Playlist Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sidebar of playlists + main column (summary widgets, settings, day-by-day checklist); stacks on phones */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#151924; --muted:#5a6173; --line:#dde0e8; --track:#e6e8ef;
  --accent:#d6203c; --accent-ink:#ffffff; --accent-soft:#fbe5e9; --ok:#1c8656; --ok-soft:#e1f3ea; --warn:#a85c06; --warn-soft:#fdf0dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1016; --surface:#171a23; --surface-2:#1d212c; --ink:#eceef4; --muted:#9aa1b3; --line:#2a2f3c; --track:#272b37;
  --accent:#ff4a61; --accent-ink:#1a0006; --accent-soft:#3a1720; --ok:#40cf8f; --ok-soft:#153327; --warn:#f2a54a; --warn-soft:#3a2912; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1016; --surface:#171a23; --surface-2:#1d212c; --ink:#eceef4; --muted:#9aa1b3; --line:#2a2f3c; --track:#272b37;
  --accent:#ff4a61; --accent-ink:#1a0006; --accent-soft:#3a1720; --ok:#40cf8f; --ok-soft:#153327; --warn:#f2a54a; --warn-soft:#3a2912; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:16px;height:16px;fill:var(--accent-ink)}
.brand h1{font:800 21px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.02em}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.daychip:focus-visible,.pl-item:focus-visible,.dayhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px}
@media (max-width:860px){aside.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.side-label{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:2px 4px}
@media (max-width:860px){.side-label{display:none}}
.pl-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;width:100%;min-width:0}
@media (max-width:860px){.pl-item{width:auto;flex:none;max-width:240px;background:var(--surface);border-color:var(--line)}}
.pl-item:hover{background:var(--surface)}
.pl-item.on{background:var(--surface);border-color:var(--line);box-shadow:0 1px 0 var(--line)}
.pl-item .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl-item .sub{font-size:12px;color:var(--muted)}
.pl-item .txt{min-width:0;flex:1}
.mini-ring{width:30px;height:30px;flex:none}
.add-item{border:1px dashed var(--line);color:var(--muted);justify-content:center;font-weight:600}
.add-item:hover{color:var(--ink);border-color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}
h2.title{font:800 clamp(22px,3.2vw,30px)/1.12 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
h3.sec{font:700 18px/1.2 var(--f-display);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin-top:8px}
.meta b{color:var(--ink);font-weight:600}
.pl-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pl-head .grow{flex:1;min-width:0}
.linkrow{display:flex;align-items:center;gap:8px;margin-top:10px;min-width:0}
.linkrow a{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.head-actions{display:flex;gap:6px;flex-wrap:wrap}
.widgets{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:1060px){.widgets{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.widgets .speeds{grid-column:1/-1}}
@media (max-width:560px){.widgets{grid-template-columns:minmax(0,1fr)}}
.ring-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--track)}
.ring .fgc{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring.complete .fgc{stroke:var(--ok)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font:800 40px/1 var(--f-display);letter-spacing:-.02em}
.ring .pct small{font-size:19px;font-weight:600}
.ring .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.ring-sub{font-size:13px;color:var(--muted)}
.ring-sub b{color:var(--ink)}
.days-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.days-big .n{font:800 46px/1 var(--f-display);letter-spacing:-.02em}
.days-big .u{font-weight:600;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden;margin:14px 0 8px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.done > i{background:var(--ok)}
.bar-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:600;margin-top:12px}
.alert .btn{padding:5px 10px;font-size:13px;margin-left:auto}
.speeds table{width:100%;border-collapse:collapse;font-size:14px}
.speeds td{padding:7px 0;border-bottom:1px solid var(--line)}
.speeds tr:last-child td{border-bottom:0}
.speeds td:last-child{text-align:right}
.speeds tr.cur td{color:var(--accent);font-weight:700}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .flabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;min-width:0}
textarea{resize:vertical;font-family:var(--f-mono);font-size:12px}
.hm{display:flex;gap:6px;align-items:center}
.hm input{width:100%}
.hm span{font-size:13px;color:var(--muted)}
.daychips{display:flex;gap:5px;flex-wrap:wrap}
.daychip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.daychip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.plan-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.plan-head .grow{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:flex;flex-direction:column;gap:8px}
.day{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.overdue{border-left:4px solid var(--warn)}
.day.complete{background:var(--surface-2)}
.dayhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none}
.dayhead .when{flex:1;min-width:0}
.dayhead .d1{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dayhead .d2{font-size:13px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
.chip.today{background:var(--accent);color:var(--accent-ink)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.daycount{font-size:13px;color:var(--muted);white-space:nowrap}
.caret{width:18px;height:18px;flex:none;transition:transform .2s;fill:var(--muted)}
.day.open .caret{transform:rotate(90deg)}
.vids{list-style:none;margin:0;padding:0 14px 10px 14px;border-top:1px solid var(--line)}
.vid{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.vid:last-child{border-bottom:0}
.vid .ix{font-size:12px;color:var(--muted);width:34px;flex:none}
.vid .vt{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.vid.checked .vt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.vid .vd{font-size:12px;color:var(--muted);white-space:nowrap}
.vid a.play{font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.cb{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;cursor:pointer;display:grid;place-content:center;background:var(--surface);transition:background .15s,border-color .15s;margin:0}
.cb::after{content:"";width:11px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{opacity:1;border-color:#fff}
.cb:indeterminate{background:var(--ok-soft);border-color:var(--ok)}
.cb:indeterminate::after{opacity:1;border:0;width:10px;height:2.5px;background:var(--ok);transform:none}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;padding:36px 18px}
.empty p{color:var(--muted);max-width:52ch;margin:8px auto 16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.span-all{grid-column:1/-1}
.tabs{display:flex;gap:6px;margin:14px 0}
.status{font-size:13px;margin-top:10px;min-height:1.2em}
.status.err{color:var(--accent)}
.status.ok{color:var(--ok)}
.fetched{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px}
.fetched .grow{flex:1;min-width:0}
.fetched b{display:block;overflow-wrap:anywhere}
.handoff{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.handoff li{padding-left:4px}
.handoff li::marker{color:var(--muted);font-weight:600}
.handoff input{margin-top:6px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.dialog h3{margin:0 0 6px;font:700 20px var(--f-display)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.savedot{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savedot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></div>
      <div><h1>Playlist Progress Tracker</h1><small>Length, daily plan and progress for every playlist</small></div>
    </div>
    <span class="savedot" id="saveState"><i></i><span>Saved</span></span>
    <button class="btn ghost" id="btnKey" hidden>API key (optional)</button>
    <button class="btn ghost" id="btnBackup">Backup</button>
  </header>
  <div class="layout">
    <aside class="side" id="side" aria-label="Your playlists"></aside>
    <main id="main"></main>
  </div>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body></html>
